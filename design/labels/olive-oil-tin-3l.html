<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Kallmi Oil — 3 l Tin Front Label</title>
<!--
  Kallmi Oil 3 l tin, FRONT label (wide face). The back info goes on the
  tin's narrow side as a separate 48 × 140 mm label: the 500 ml bottle back
  with the tin's barcode (render.js format "tinside"), so it shares that die.

  Tin: rectangular 3 l olive-oil tin, assumed ~165 × 105 × 250 mm.
  Label on each wide face, clear of the rolled seams and the top shoulder.
  Trim 120 × 170 mm, 3 mm bleed → 126 × 176 mm.
  MEASURE THE TIN before ordering: the wide face minus ~20 mm each side.

  Legal: 1169/2011 Annex IX — over 1 l, quantity figures at least 6 mm tall;
  ℮ at least 3 mm; mandatory text 1.2 mm x-height (Jost 7.4 pt) → 8.5 pt used.

  Render: node design/labels/render.js tin
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300..600&display=block" rel="stylesheet">
<style>
  :root {
    --black: #141311;
    --ink: #1A1814;
    --cream: #F8F5EF;
    --gold: #C4A862;
    --gold-print: #A88B45;
    --muted-dark: #B8B4AC;
    --muted-light: #5C584F;
    --hair: #D4CFC4;

    --display: "Bodoni Moda", "Didot", serif;
    --ui: "Jost", "Futura", sans-serif;
    --legal: 9pt;

    --trim-w: 120mm;
    --trim-h: 170mm;
    --bleed: 3mm;
    --safe: 5mm;
  }
  @page { size: 126mm 176mm; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #d9d6cf; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .sheet {
    position: relative;
    width: calc(var(--trim-w) + 2 * var(--bleed));
    height: calc(var(--trim-h) + 2 * var(--bleed));
    overflow: hidden;
    break-after: page;
  }
  .sheet:last-child { break-after: auto; }
  .label {
    position: absolute; inset: var(--bleed);
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .guide { display: none; position: absolute; pointer-events: none; }
  body.proof .guide { display: block; }
  .guide.trim { inset: var(--bleed); outline: 0.25mm solid #e5007e; }
  .guide.safe { inset: calc(var(--bleed) + var(--safe)); outline: 0.25mm dashed #00a0e3; }

  .e-mark { height: 4.2mm; width: auto; vertical-align: 0; margin-left: 1mm; }

  /* ---------- FRONT ---------- */
  .front { background: var(--black); color: var(--cream); }
  .front .label { padding: 17mm 14mm 14mm; }
  .front .frame {
    position: absolute; inset: calc(var(--bleed) + 6mm);
    border: 0.35mm solid var(--gold);
  }
  .front .frame::after {
    content: ""; position: absolute; inset: 1.4mm;
    border: 0.15mm solid rgba(196, 168, 98, .55);
  }
  .front .sun { width: 40mm; height: 40mm; }
  .front .wordmark { width: 66mm; margin-top: 7mm; }
  .front .place {
    font: 400 9pt/1 var(--ui); letter-spacing: .34em; padding-left: .34em;
    color: var(--gold); margin-top: 3.4mm;
  }
  .front .place.est { margin-top: 1.8mm; color: var(--muted-dark); text-transform: uppercase; }
  .front .mid { margin: auto 0; display: flex; flex-direction: column; align-items: center; }
  .front .rule { width: 14mm; border-top: 0.3mm solid var(--gold); margin-bottom: 6mm; }
  .front .name { font: italic 400 34pt/1 var(--display); font-variation-settings: "opsz" 72; }
  .front .name-sub {
    font: 500 12.5pt/1 var(--ui); letter-spacing: .34em; padding-left: .34em;
    color: var(--gold); text-transform: uppercase; margin-top: 4.6mm;
  }
  .front .name-sq { font: 300 13.5pt/1.2 var(--ui); color: var(--muted-dark); margin-top: 4.2mm; }

  .front .foot {
    width: 100%; display: flex; justify-content: space-between; align-items: flex-end;
  }
  .front .meta {
    text-align: left; font: 400 8.4pt/1.6 var(--ui); letter-spacing: .22em;
    text-transform: uppercase; color: var(--muted-dark);
  }
  .front .meta b { font-weight: 500; color: var(--cream); }
  /* over 1 l → figures ≥ 6 mm. Jost lining figures ≈ 0.70 em → 26 pt ≈ 6.4 mm */
  .front .vol { font: 400 26pt/0.8 var(--ui); color: var(--cream); white-space: nowrap; }
  .front .vol small { font-size: 18pt; margin-left: 1.2mm; }

</style>
</head>
<body>

<!-- ================= FRONT ================= -->
<section class="sheet front">
  <div class="frame"></div>
  <div class="label">
    <img class="sun" src="../../public/kallmi-sun.svg" alt="">
    <img class="wordmark" src="wordmark-cream.svg" alt="Kallmi">
    <div class="place">Durrës · Albania</div>
    <div class="place est">Est. 2004</div>
    <div class="mid">
      <div class="rule"></div>
      <div class="name">Extra Virgin</div>
      <div class="name-sub">Olive Oil</div>
      <div class="name-sq">Vaj ulliri ekstra i virgjër</div>
    </div>
    <div class="foot">
      <div class="meta">Cold pressed<br>Harvest <b data-harvest>2026</b></div>
      <div class="vol"><span data-ml>3</span><small>l<svg class="e-mark" viewBox="88 -34 1060 1130" aria-label="℮"><path transform="matrix(1 0 0 -1 0 1062)" fill="currentColor" d="M619 -34Q461 -34 341.0 38.5Q221 111 154.5 242.5Q88 374 88 531Q88 702 158.0 830.0Q228 958 350.0 1027.0Q472 1096 619 1096Q770 1096 892.0 1025.5Q1014 955 1081.0 826.0Q1148 697 1148 531H321V175Q371 121 452.5 86.0Q534 51 619 51Q751 51 841.5 103.0Q932 155 1014 285L1086 243Q990 90 880.5 28.0Q771 -34 619 -34ZM917 616V893Q866 946 784.5 978.5Q703 1011 617 1011Q438 1011 321 894V616Z"/></svg></small></div>
    </div>
  </div>
  <div class="guide trim"></div><div class="guide safe"></div>
</section>


<script src="label-shared.js"></script>
</body>
</html>
